<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>DeepRead - AI 阅读管理</title>
    <style>
      html { background: #fafafa; color-scheme: light; }
      body { margin: 0; background: #fafafa; }
      /* 兜底：styles.css 由 JS 注入、晚于首帧，若 UA 默认描边先画出来就会沿撑满视口的 body 边缘闪一圈，
         所以抑制必须内联在 head 里。注意：2026-09-22 实测已证明"刷新闪黑带"与焦点环无关
         （无痕、关硬件加速、生产构建、about:blank 全照样闪），这条只是常规加固，别再指望它治那个症状 */
      html:focus-visible, body:focus-visible { outline: none; box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
