<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>DeepRead - AI 阅读管理</title>
    <style>
      html { background: #fafafa; color-scheme: light; }
      body { margin: 0; background: #fafafa; }
      /* 键盘刷新后 Chrome 会把焦点还给文档，命中 :focus-visible 时在撑满视口的 body 上画一圈默认黑色描边；
         styles.css 是 JS 注入的，晚于首帧，所以这条抑制必须内联在 head 里 */
      html:focus-visible, body:focus-visible { outline: none; box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
